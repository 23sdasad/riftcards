name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install golangci-lint
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('client/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Format check (Go)
        shell: bash
        working-directory: server
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Go lint
        working-directory: server
        run: golangci-lint run ./...

      - name: C# build
        shell: bash
        run: |
          dotnet build client/src/Core/Riftcards.Client.Core.csproj --warnaserror
          dotnet build client/Riftcards.Client.csproj --warnaserror

      - name: C# format check
        shell: bash
        run: |
          dotnet format client/src/Core/Riftcards.Client.Core.csproj --verify-no-changes
          dotnet format client/Riftcards.Client.csproj --verify-no-changes
          dotnet format client/tests/Riftcards.Client.Core.Tests/Riftcards.Client.Core.Tests.csproj --verify-no-changes

      - name: Go test
        working-directory: server
        run: go test -race ./...

      - name: C# test
        run: dotnet test client/tests/Riftcards.Client.Core.Tests/Riftcards.Client.Core.Tests.csproj
