name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "ai-docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Go 是唯一的引导前提；其余依赖的版本、URL 与哈希只在 Taskfile.yml 声明。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            tools/toolchain/go.sum

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cache
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('client/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Bootstrap pinned dependencies
        shell: bash
        run: go -C tools/toolchain run . bootstrap --without godot

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run repository gate
        run: task ci
