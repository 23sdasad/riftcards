version: "3"

vars:
  SERVER_DIR: server
  CORE_PROJECT: client/src/Core/Lscs.Client.Core.csproj
  CLIENT_PROJECT: client/Lscs.Client.csproj
  TEST_PROJECT: client/tests/Lscs.Client.Core.Tests/Lscs.Client.Core.Tests.csproj

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  bootstrap:
    desc: Install repository-local developer tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  fmt:
    desc: Format Go and C# sources
    cmds:
      - cmd: gofmt -w ./cmd ./internal
        dir: "{{.SERVER_DIR}}"
      - dotnet format {{.CORE_PROJECT}}
      - dotnet format {{.CLIENT_PROJECT}}
      - dotnet format {{.TEST_PROJECT}}

  lint:
    desc: Run static analysis and formatting checks
    cmds:
      - cmd: go vet ./...
        dir: "{{.SERVER_DIR}}"
      - cmd: golangci-lint run ./...
        dir: "{{.SERVER_DIR}}"
      - dotnet build {{.CORE_PROJECT}} --warnaserror
      - dotnet build {{.CLIENT_PROJECT}} --warnaserror
      - dotnet format {{.CORE_PROJECT}} --verify-no-changes
      - dotnet format {{.CLIENT_PROJECT}} --verify-no-changes
      - dotnet format {{.TEST_PROJECT}} --verify-no-changes

  test:
    desc: Run server and client tests
    cmds:
      - cmd: go test -race ./...
        dir: "{{.SERVER_DIR}}"
      - dotnet test {{.TEST_PROJECT}}

  check:
    desc: Run formatting, lint and tests
    cmds:
      - task: fmt
      - task: lint
      - task: test

  run:server:
    desc: Run the authoritative Go server
    cmds:
      - cmd: go run ./cmd/lscs-server -addr 127.0.0.1:8080
        dir: "{{.SERVER_DIR}}"

  run:client:
    desc: Open the Godot client project
    cmds:
      - godot --path ./client --editor

  vuln:
    desc: Scan Go dependencies for known vulnerabilities
    cmds:
      - cmd: govulncheck ./...
        dir: "{{.SERVER_DIR}}"
